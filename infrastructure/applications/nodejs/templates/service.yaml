apiVersion: v1
kind: Service
metadata:
  labels:
    app: nodejs
  name: nodejs-svc
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - name: http
    # No Docker Desktop o LoadBalancer fica acessível em localhost:<servicePort>.
    port: {{ .Values.servicePort }}
    protocol: TCP
    targetPort: 3000
  selector:
    app: nodejs
  type: LoadBalancer
