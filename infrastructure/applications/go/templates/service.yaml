apiVersion: v1
kind: Service
metadata:
  labels:
    app: go
  name: go-svc
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - name: http
    # No Docker Desktop o LoadBalancer fica acessível em localhost:<servicePort>.
    port: {{ .Values.servicePort }}
    protocol: TCP
    targetPort: 8080
  selector:
    app: go
  type: LoadBalancer
